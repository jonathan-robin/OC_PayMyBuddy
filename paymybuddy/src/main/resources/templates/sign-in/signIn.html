<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/styles/cssandjs/main.css}" rel="stylesheet" />

    <title>Sign In</title>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

    <div class="card shadow-lg p-4" style="width: 30vw; border-radius: 10px;">
        <div class="text-center mb-4 w-50 mx-auto">
            <button class="btn btn-success fw-bold" style="width: 100%; font-size: 18px;">PayMyBuddy</button>
        </div>

        <form action="#" th:action="@{/sign-in}" th:object="${signIn}" method="post">
            <!-- Champ Email -->
            <div class="form-group mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" class="form-control" id="email" th:field="*{email}" placeholder="Email" required>
            </div>

            <!-- Champ Password -->
            <div class="form-group mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="text" class="form-control" id="password" th:field="*{password}" placeholder="Password" required>
            </div>

            <!-- Champ Firstname -->
            <div class="form-group mb-3">
                <label for="firstname" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstname" th:field="*{firstname}" placeholder="First Name" required>
            </div>

            <!-- Champ Lastname -->
            <div class="form-group mb-3">
                <label for="lastname" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastname" th:field="*{lastname}" placeholder="Last Name" required>
            </div>

            <!-- Champ Username -->
            <div class="form-group mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="Username" required>
            </div>

            <!-- Boutons Submit et Reset -->
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">Submit</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
