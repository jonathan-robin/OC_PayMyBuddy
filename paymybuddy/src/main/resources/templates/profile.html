<!doctype html>
<html lang="en">
  <head>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Profil | PayMyBuddy</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
	<link th:href="@{/main.css}" rel="stylesheet" />
</head>
<body class="bg-light">

    <!-- Inclusion de l'en-tête -->
    <div th:replace="fragments/header :: header"></div>

    <div class="container mt-5">
        <div class="card shadow-lg p-4">
            <h2 class="text-center text-primary">Mon Profil</h2>
            <hr>

            <div class="row">
                <div class="col-md-6">
                    <p><strong>Nom :</strong> <span th:text="${user.lastname}"></span></p>
                    <p><strong>Prénom :</strong> <span th:text="${user.firstname}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Nom d'utilisateur :</strong> <span th:text="${user.username}"></span></p>
                    <p><strong>Email :</strong> <span th:text="${user.email}"></span></p>
                </div>
            </div>

            <div class="text-center">
                <p class="h5"><strong>Solde :</strong> <span th:text="${user.balance}"></span> €</p>
            </div>

            <div class="mt-4 text-center">
                <a th:href="@{/edit-profile}" class="btn btn-warning me-3">Modifier le profil</a>
                <a th:href="@{/home}" class="btn btn-secondary">Retour à l'accueil</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
