<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Profil | PayMyBuddy</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <link th:href="@{/main.css}" rel="stylesheet" />
</head>
<body class="bg-light">

    <!-- Inclusion de l'en-tête -->
    <div th:replace="fragments/header :: header"></div>

    <div class="d-flex justify-content-center mt-5">
        <div class="card shadow-lg p-4" style="width: 50vw; border-radius: 10px;">
            <div class="d-flex justify-content-between mb-4">
                <h3 class="text-primary">Mon Profil</h3>
                <a class="btn btn-success" onclick="showAlert()">Modifier</a>
            </div>
            <hr>

            <div class="row mb-3">
                <div class="col-md-6">
                    <p><strong>Nom :</strong> <span th:text="${user.lastname}"></span></p>
                    <p><strong>Prénom :</strong> <span th:text="${user.firstname}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Nom d'utilisateur :</strong> <span th:text="${user.username}"></span></p>
                    <p><strong>Email :</strong> <span th:text="${user.email}"></span></p>
                </div>
            </div>

            <div class="text-center mb-4">
                <p class="h5"><strong>Solde :</strong> <span th:text="${user.balance}"></span> €</p>
            </div>

            <div class="d-flex justify-content-center">
                <a th:href="@{/}" class="btn btn-outline-secondary">Retour</a>
            </div>
        </div>
    </div>
    
    <script>
	    function showAlert() {
	        alert("Update profile to come !");
	    }
	</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
