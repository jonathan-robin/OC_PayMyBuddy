<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Contact | PayMyBuddy</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <link th:href="@{/main.css}" rel="stylesheet" />
</head>
<body class="bg-light">

    <!-- Inclusion de l'en-tête -->
    <div th:replace="fragments/header :: header"></div>

    <div class="d-flex justify-content-center mt-5">
        <div class="card shadow-lg p-4" style="width: 50vw; border-radius: 10px;">
            <h3 class="text-primary text-center mb-4">Contactez-nous</h3>
            <hr>

            <form action="#" th:action="@{/send-message}" method="post">
                <div class="form-group">
                    <label for="name">Nom</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Votre nom" required>
                </div>

                <div class="form-group mt-3">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Votre email" required>
                </div>

                <div class="form-group mt-3">
                    <label for="subject">Sujet</label>
                    <input type="text" id="subject" name="subject" class="form-control" placeholder="Objet de votre message" required>
                </div>

                <div class="form-group mt-3">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" class="form-control" rows="4" placeholder="Votre message..." required></textarea>
                </div>

                <div class="d-flex justify-content-center mt-4">
                    <button type="submit" class="btn btn-success me-3">Envoyer</button>
                    <a th:href="@{/home}" class="btn btn-outline-secondary">Retour</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
