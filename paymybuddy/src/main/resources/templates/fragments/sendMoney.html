<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/main.css}" rel="stylesheet" />
</head>
<body class="bg-light">

    <!-- Fragment "sendMoneyForm" -->
    <div th:fragment="sendMoneyForm">
        <div class="card shadow-lg p-4 mt-4" style="width: 50vw; border-radius: 10px; margin: auto;">
            <div class="d-flex justify-content-between mb-4">
                <h3 class="text-primary">Send Money</h3>
                <form action="#" th:action="@{/transfer/connections}" method="get">
                	<button class="btn btn-primary" th:onclick="navAddConnection()" type="submit">Add Connection</button>
                </form>
            </div>

            <div class="wrapper-table d-flex flex-row">
                <form action="#" th:action="@{/transaction}" th:object="${connection}" method="post" class="d-flex flex-row justify-content-around w-100">
                    <div class=" d-flex flex-row mx-2" style="width:95%">
                        
                        <!-- Dropdown for selecting the user -->
                        <div class="form-group w-25 mx-2">
                            <label for="dropDownList" class="form-label">Select User</label>
                            <select class="form-control" id="dropDownList" th:field="*{userTo}">
                                <option value="0">Select option</option>
                                <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
                            </select>
                        </div>

                        <!-- Description input -->
                        <div class="form-group w-50 mx-2">
                            <label for="description" class="form-label">Description</label>
                            <input type="text" class="form-control" id="description" th:field="*{description}" placeholder="Enter description" required />
                        </div>

                        <!-- Amount input -->
                        <div class="form-group w-25 mx-2">
                            <label for="amount" class="form-label">Amount</label>
                            <input type="number" class="form-control" id="amount" th:field="*{amount}" step=".01" placeholder="Enter amount" required />
                        </div>
                    </div>
  				<div class="d-flex justify-content-center"><button class="btn bg-green" style="height:50%; margin-top:auto;" type="submit">Pay</button></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and necessary Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
