<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/main.css}" rel="stylesheet" />

    <title>Login Error</title>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

    <div class="card shadow-lg p-4" style="width: 25vw; border-radius: 10px;">
        <div class="text-center mb-4 w-75 mx-auto">
            <h5 class="text-danger">Error with credentials</h5>
        </div>

        <div class="d-flex justify-content-center flex-row align-items-center">
            <div class="wrapper-button mx-2 text-center">
                <button th:onclick="createAccount();" class="btn btn-success btn-lg">Create an account</button>
                <small class="text-muted">No account yet?</small>
            </div>
            <div class="wrapper-button mx-2 text-center">
                <button th:onclick="logIn();" class="btn btn-primary btn-lg">Log again</button>
                <small class="text-muted">Try again</small>
            </div>
        </div>
    </div>
	<script src="/js/cssandjs/action.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
